# Local / small self-hosted deployment.
#
# Usage (any shell, including PowerShell):
#   docker compose up --build
#
# Optional: copy `.env.example` → `.env` and set a real secret. Compose loads
# `.env` automatically. The default below is for local only — never ship it.
#
# Frontend (vidio-web): copy `examples/vidio-web.env.local` into that repo as
# `.env.local` so registration/login BFF calls find VIDIO_API_BASE_URL.
#
# Storage is currently in-memory, so `api` and `worker` do not share state and
# the worker is a heartbeat skeleton. Both are included so the topology matches
# production once the PostgreSQL adapter lands.

services:
  api:
    build: .
    image: vidio:local
    command: ["vidio-api"]
    ports:
      - "8080:8080"
    environment:
      VIDIO_BIND_ADDR: 0.0.0.0:8080
      VIDIO_ACCESS_TOKEN_SECRET: ${VIDIO_ACCESS_TOKEN_SECRET:-change-me-in-production-min-32-bytes-long}
      VIDIO_ACCESS_TOKEN_TTL_SECS: ${VIDIO_ACCESS_TOKEN_TTL_SECS:-900}
      VIDIO_REFRESH_TOKEN_TTL_SECS: ${VIDIO_REFRESH_TOKEN_TTL_SECS:-2592000}
      VIDIO_ADDON_FETCH_TIMEOUT_MS: ${VIDIO_ADDON_FETCH_TIMEOUT_MS:-8000}
      VIDIO_ADDON_ALLOW_PRIVATE_NETWORKS: ${VIDIO_ADDON_ALLOW_PRIVATE_NETWORKS:-false}
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped

  worker:
    build: .
    image: vidio:local
    command: ["vidio-worker"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped
    # The worker has no HTTP port, so it uses the image default (no override
    # needed); compose does not run the image HEALTHCHECK against it by design.
