[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/worker",
    "crates/domain",
    "crates/addon-protocol",
    "crates/auth",
    "crates/addon-runtime",
    "crates/application",
    "crates/persistence",
    "crates/http-api",
    "crates/telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "GPL-3.0-or-later"
repository = "https://github.com/NuvioMedia/vidio"

[workspace.dependencies]
# Async runtime and web
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros", "json"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout"] }
hyper = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Data types
uuid = { version = "1.11", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
url = { version = "2.5", features = ["serde"] }

# Errors
thiserror = "2"

# Auth / crypto
argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

# Utilities
percent-encoding = "2.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
once_cell = "1"

# Internal crates
domain = { path = "crates/domain" }
addon-protocol = { path = "crates/addon-protocol" }
auth = { path = "crates/auth" }
addon-runtime = { path = "crates/addon-runtime" }
application = { path = "crates/application" }
persistence = { path = "crates/persistence" }
http-api = { path = "crates/http-api" }
telemetry = { path = "crates/telemetry" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
